
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f0f0f0;
    background-image:
        linear-gradient(90deg, #e4e4e4 1px, transparent 1px),
        linear-gradient(#e4e4e4 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 90%;
    max-width: 450px;
    padding: 35px 28px;
    background: #2196f3;
    border-radius: 35px;
    box-shadow: 0 4px 10px #0002;
}

.display {
    width: 100%;
    height: 90px;
    margin-bottom: 30px;
    padding: 15px;
    border: 2px solid #b8ddf8;
    border-radius: 12px;
    background: #e6f4ff;
    color: #111;
    font-size: 36px;
    text-align: right;
    outline: none;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

button {
    height: 78px;
    border: none;
    border-radius: 12px;
    background: #1764b9;
    color: white;
    font-size: 42px;
    cursor: pointer;
    box-shadow: 0 3px 5px #0001;
    transition: background 0.15s, transform 0.1s;
}

button:hover {
    background: #10539f;
}

button:active {
    transform: scale(0.95);
}

@media (max-width: 400px) {
    .calculator {
        padding: 25px 18px;
    }

    .buttons {
        gap: 12px;
    }

    button {
        height: 65px;
        font-size: 32px;
    }
}.backspace {
    display: block;
    width: 65px;
    height: 45px;
    margin: -18px 0 20px auto;
    font-size: 25px;
    background: #1764b9;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="calculator">

    <input type="text" class="display"
           id="display" value="0"
           readonly aria-label="Calculator display">
     <button class="backspace" onclick="backspace()">⌫</button>
    <div class="buttons">
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('+')">+</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('-')">−</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="clearDisplay()">=</button>
    </div>

</div>

<script>
const display = document.getElementById("display");

let expression = "";
let finished = false;

function press(value) {

    if (finished) {
        if ("0123456789".includes(value)) {
            expression = "";
        }
        finished = false;
    }

    if (value === "+" || value === "-") {
        if (expression === "" && value === "-") {
            expression = "-";
        } else if (expression !== "" &&
                   !expression.endsWith("+") &&
                   !expression.endsWith("-")) {
            expression += value;
        }
    } else {
        expression += value;
    }

    display.value = expression || "0";
}

function clearDisplay() {
    if (expression === "" || finished) {
        expression = "";
        display.value = "0";
        finished = false;
        return;
    }

    try {
        const result = calculate(expression);
        expression = String(result);
        display.value = expression;
        finished = true;
    } catch {
        display.value = "Error";
        expression = "";
        finished = true;
    }
}

function calculate(exp) {
    if (!/^-?\d+(?:\.\d+)?(?:[+-]\d+(?:\.\d+)?)*$/.test(exp)) {
        throw new Error("Invalid expression");
    }

    const numbers = exp.match(/-?\d+(?:\.\d+)?/g).map(Number);
    const operators = exp.match(/[+-]/g) || [];

    let result = numbers[0];

    for (let i = 0; i < operators.length; i++) {
        if (operators[i] === "+") {
            result += numbers[i + 1];
        } else {
            result -= numbers[i + 1];
        }
    }

    return Number(result.toFixed(8));
}
function backspace() {
    if (finished) {
        expression = "";
        finished = false;
    } else {
        expression = expression.slice(0, -1);
    }

    display.value = expression || "0";
}
</script>

</body>
</html>
